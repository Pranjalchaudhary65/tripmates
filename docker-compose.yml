services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tripmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - tripmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ forces the container's own shell to resolve these, not docker
      # compose at file-parse time - pg_isready needs to run against
      # whatever POSTGRES_USER/POSTGRES_DB actually ended up as inside
      # the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tripmate-redis
    restart: unless-stopped
    environment:
      # Only consumed by the healthcheck below - without it $$REDIS_PASSWORD
      # is empty inside the container and the ping never authenticates.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - tripmate_redis_data:/data
    healthcheck:
      # CMD-SHELL, not CMD: exec form has no shell, so $$REDIS_PASSWORD would
      # reach redis-cli as the literal text "$REDIS_PASSWORD". The grep is
      # needed because redis-cli exits 0 even on a NOAUTH/WRONGPASS reply.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    # Local SMTP sink: accepts every email the app sends and delivers none.
    # Read them at http://localhost:8025. Bound to 127.0.0.1 because its
    # inbox holds live verification codes and has no login.
    image: axllent/mailpit:v1.32.0
    container_name: tripmate-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      # Mailpit otherwise reverse-resolves every SMTP client's IP before
      # greeting it; inside Docker that lookup has no answer and stalls each
      # connection for seconds, long enough to trip the app's SMTP timeout.
      MP_SMTP_DISABLE_RDNS: "true"

  adminer:
    image: adminer:4.8.1
    container_name: tripmate-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tripmate_postgres_data:
  tripmate_redis_data:
