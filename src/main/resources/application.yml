spring:
  application:
    name: tripmate

  config:
    # Reads the git-ignored .env (KEY=VALUE is valid .properties syntax) so
    # local runs need no shell exports. "optional:" keeps CI and containers,
    # which inject real environment variables instead, from failing on a
    # missing file. Real environment variables still take precedence.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        # Send string parameters untyped so PostgreSQL infers each one from
        # its column. Sent as varchar (the driver default), a parameter
        # compared with a citext column resolves to text = text, and the
        # case-insensitive email match silently becomes case-sensitive.
        stringtype: unspecified

  mail:
    # Mailpit in local dev (docker-compose.yml); its web UI at
    # http://localhost:8025 shows everything sent. Real SMTP credentials go
    # in the environment of a deployed instance, never in this file.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # JavaMail waits forever by default; a hung SMTP server would pin
      # the async mail threads indefinitely.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate # never "update" - every schema change goes through Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

tripmate:
  cors:
    # Comma-separated exact origins, e.g. https://app.example.com. No default:
    # an unset value stops startup rather than guessing, and CorsProperties
    # rejects wildcards, paths and non-localhost plain http.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  mail:
    from: ${MAIL_FROM:TripMates <no-reply@tripmate.local>}

  identity:
    breached-password:
      base-url: https://api.pwnedpasswords.com
      timeout: 3s
    verification:
      code-ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-codes-per-day: 5
      # No default: codes must never be hashed under a guessable key.
      hmac-key: ${OTP_HMAC_KEY}

management:
  endpoints:
    # Deny-by-default for actuator too: every endpoint is switched off, not
    # just hidden from HTTP, and health is switched back on read-only. A new
    # endpoint (env, heapdump, loggers) can never appear by accident when a
    # dependency or Boot upgrade adds one.
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      # show-details: always is only safe because this is a local dev box
      # nobody but the developer can reach. A DOWN health check with full
      # details tells an attacker exactly which backing service to go after
      # (db vs redis) - this must drop to "when-authorized" (admin-only) or
      # "never" before this app is reachable from anywhere but localhost.
      show-details: always
      probes:
        enabled: true
  health:
    # Mail is sent in the background and a failed send is retried by the
    # user via "resend code". An SMTP outage must not mark the whole app
    # DOWN and get it restarted by the platform's health checks.
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema). MDC entries become
      # top-level fields, which is how correlationId lands on every line
      # written while a request is being handled.
      console: ecs

springdoc:
  # Pinned explicitly - SecurityConfig permits exactly these paths, so they
  # must not move if a springdoc upgrade changes its defaults.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Swagger UI otherwise sends the spec URL to validator.swagger.io for a
    # badge image - a third-party call the Swagger UI CSP blocks anyway.
    validator-url: none
  # Only application endpoints are documented; actuator and /error are not.
  paths-to-match: /api/v1/**
