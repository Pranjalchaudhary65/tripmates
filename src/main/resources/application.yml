spring:
  application:
    name: tripmate

  config:
    # Reads the git-ignored .env (KEY=VALUE is valid .properties syntax) so
    # local runs need no shell exports. "optional:" keeps CI and containers,
    # which inject real environment variables instead, from failing on a
    # missing file. Real environment variables still take precedence.
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties:
        # Send string parameters untyped so PostgreSQL infers each one from
        # its column. Sent as varchar (the driver default), a parameter
        # compared with a citext column resolves to text = text, and the
        # case-insensitive email match silently becomes case-sensitive.
        stringtype: unspecified

  mail:
    # Mailpit in local dev (docker-compose.yml); its web UI at
    # http://localhost:8025 shows everything sent. Real SMTP credentials go
    # in the environment of a deployed instance, never in this file.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # JavaMail waits forever by default; a hung SMTP server would pin
      # the async mail threads indefinitely.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      # Uploads are photos: one frame is at most 5 MB, and the largest request
      # (a selfie check) carries two. Tomcat refuses anything bigger while
      # reading it, with 413, before it is held in memory or on disk whole.
      max-file-size: 5MB
      max-request-size: 11MB

  jpa:
    hibernate:
      ddl-auto: validate # never "update" - every schema change goes through Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      # Login is refused while Redis is unreachable (rate limits and lockout
      # live there), so an outage has to surface in seconds, not after
      # Lettuce's 60-second default.
      timeout: 2s
      connect-timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  # Tomcat's RemoteIpValve replaces the socket address with the client
  # address from X-Forwarded-For, but only when the socket peer matches
  # internal-proxies, and only from the right-hand end of the header (the
  # entries our own proxy appended, which a client cannot forge). Set
  # explicitly so a cloud platform auto-detected by Boot cannot switch it on
  # with Tomcat's default list of every private range.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Proxy addresses (CIDR list, or a regex) whose X-Forwarded-For is
      # believed. Empty trusts no one: the header is ignored and the socket
      # address is used.
      internal-proxies: ${TRUSTED_PROXIES:}
      remote-ip-header: x-forwarded-for

tripmate:
  cors:
    # Comma-separated exact origins, e.g. https://app.example.com. No default:
    # an unset value stops startup rather than guessing, and CorsProperties
    # rejects wildcards, paths and non-localhost plain http.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  mail:
    from: ${MAIL_FROM:TripMates <no-reply@tripmate.local>}

  vibe:
    # Quiz draft saves, submissions, profile edits and deal-breakers together,
    # per account. A draft is saved after every quiz step.
    write-limit:
      capacity: 120
      period: 1h

  trips:
    # Every limit is per account. Opening trips and sending join requests are
    # what a spammer would repeat; reads cover browse (a spatial query),
    # trip pages and both inboxes together.
    create-limit:
      capacity: 10
      period: 24h
    join-request-limit:
      capacity: 30
      period: 24h
    decision-limit:
      capacity: 200
      period: 1h
    read-limit:
      capacity: 600
      period: 10m
    # Listed trips one host may have that are not over yet.
    max-current-trips: 10
    # Join requests one account may have waiting for an answer.
    max-pending-requests: 20
    # Which ConflictPremortem lists the conversations a locked trip's
    # travellers should have before leaving. "rule-based" needs no API key.
    premortem: rule-based
    # Tries at an accept that keeps losing the trip's optimistic lock to
    # other changes on the same trip before it answers trip_busy.
    slot-claim-attempts: 5

  chat:
    # Per account. Sending is what a spammer repeats; reads cover the inbox,
    # conversations, history pages, icebreakers and read markers together.
    send-limit:
      capacity: 60
      period: 10m
    read-limit:
      capacity: 600
      period: 10m
    # Which MessageClassifier labels messages for moderation and which
    # IcebreakerGenerator suggests opening lines. "rule-based" needs no API
    # key; an unknown value leaves no bean, so the app refuses to start.
    classifier: rule-based
    icebreakers: rule-based
    # A moderation label at least this sure also records a trust score input;
    # weaker ones only warn both people and queue the message for review.
    penalty-confidence: 0.95
    socket:
      # Frames one connection may send (subscribes and typing notices),
      # counted per connection in memory.
      frame-limit:
        capacity: 30
        period: 10s
      max-frame-bytes: 8192
      # An opened socket must authenticate with STOMP CONNECT within this.
      connect-timeout: 10s
      # How often open sockets are checked for an expired token or an ended
      # session; the most a revoked session's socket can outlive it by.
      sweep-interval: 30s

  meetup:
    # Per account: proposing, confirming, cancelling, checking in and rating
    # together; and the match screen with venue searches.
    write-limit:
      capacity: 60
      period: 1h
    read-limit:
      capacity: 600
      period: 10m
    venue-radius-km: 25
    # A meet-up starts at least an hour after sunrise and at least two hours
    # before sunset at the venue, so it ends in daylight too.
    after-sunrise: 1h
    before-sunset: 2h
    min-notice: 3h
    max-ahead: 30d
    window-days: 14
    checkin-opens-before: 30m
    checkin-closes-after: 90m
    # Someone not checked in and not "safe" this long after the start gets an
    # email; then their emergency contact is alerted.
    ping-after: 30m
    escalate-after: 60m
    # A private comfort rating below this stops the match.
    comfort-threshold: 3
    # A change-of-plan cancellation this close to a confirmed start is a trust input.
    late-cancel-within: 24h
    selfie-retention: 7d
    job-interval: 1m
    job-batch: 100
    max-location-accuracy-meters: 150

  settlement:
    # Per account: expenses, reversals and settlement actions together; and
    # the settle-up screen with its history.
    write-limit:
      capacity: 120
      period: 1h
    read-limit:
      capacity: 600
      period: 10m
    # A suggested payment still not marked as sent this long after the trip
    # ended, or a payment marked as sent and not confirmed this long, counts
    # as ghosting the settlement (one trust input per trip and role).
    overdue-after: 7d
    # A payee's UPI ID changed this recently is pointed out to the payer.
    upi-change-warning: 48h
    recent-expenses: 50
    job-interval: 1h
    job-batch: 200

  safety:
    # Per account: sharing changes and check-ins; and the live trip screen.
    write-limit:
      capacity: 120
      period: 1h
    read-limit:
      capacity: 600
      period: 10m
    # SOS is never refused in earnest; this only stops someone flooding
    # their emergency contact.
    sos-limit:
      capacity: 20
      period: 1h
    # A check-in is emailed about when it is due; still unanswered this long
    # after, the emergency contact is alerted.
    escalate-after: 60m
    max-sos-alert-attempts: 10
    job-interval: 1m
    job-batch: 100

  outbox:
    # The relay that hands outbox events to the modules reacting to them.
    relay-interval: 5s
    max-per-run: 500
    # An event whose delivery has failed this many times is set aside as dead.
    max-attempts: 10

  trust:
    read-limit:
      capacity: 120
      period: 10m
    write-limit:
      capacity: 30
      period: 1h
    job-interval: 1m
    job-batch: 200
    # Inputs fade with age, so a score is recomputed at least this often.
    refresh-after: 1d
    # Travellers can review each other for this long after a trip ends; a
    # review still hidden when it closes becomes visible on its own.
    review-window: 14d

  moderation:
    write-limit:
      capacity: 30
      period: 1h
    read-limit:
      capacity: 60
      period: 10m
    # This many different people reporting one account within the window
    # suspends it until a moderator looks. Never fewer than 2.
    auto-suspend-reporters: 3
    auto-suspend-window: 30d

  matching:
    # Which MatchScorer computes the soft score. "rule-based" (the default) is a
    # fixed weighted comparison that needs no API key. Deal-breakers are hard
    # filters in SQL and never go through the scorer, whichever is chosen. An
    # unknown value leaves no scorer, so the app refuses to start.
    scorer: rule-based

  storage:
    # Where uploaded images are kept. Relative paths resolve against the
    # working directory; uploads/ is git-ignored and never served statically.
    local-root: ${STORAGE_LOCAL_ROOT:uploads}

  media:
    # Base64, at least 32 random bytes: signs image links. No default.
    # Rotating it only breaks links already handed out.
    signing-key: ${MEDIA_URL_SIGNING_KEY}
    url-ttl: 5m

  rate-limit:
    # Longest a single bucket call to Redis may take before the request is
    # refused with 503.
    store-timeout: 2s
    # Retry-After sent with that 503.
    unavailable-retry-after: 30s

  identity:
    # Who delivers emergency contact alerts, for every safety path (meet-ups,
    # missed trip check-ins, SOS). "mailbox" sends the alert text to the
    # user's own inbox instead of an SMS to the contact, so the demo needs no
    # SMS account. A real gateway registers its own EmergencyAlertSender; an
    # unknown value stops startup. MEETUP_ALERT_SENDER is the older name.
    emergency-alert-sender: ${EMERGENCY_ALERT_SENDER:${MEETUP_ALERT_SENDER:mailbox}}
    breached-password:
      base-url: https://api.pwnedpasswords.com
      timeout: 3s
    verification:
      code-ttl: 10m
      max-attempts: 5
      resend-cooldown: 60s
      max-codes-per-day: 5
      # No default: codes must never be hashed under a guessable key.
      hmac-key: ${OTP_HMAC_KEY}
    login:
      # Consecutive failures on one account before a CAPTCHA is demanded.
      captcha-after-failures: 3
      lockout:
        # The attempt that reaches after-failures locks for base-duration;
        # each further failure doubles it, up to max-duration. A success
        # resets the count, and it is forgotten failure-window after the
        # last failure.
        after-failures: 5
        base-duration: 1m
        max-duration: 15m
        failure-window: 24h
    access-token:
      issuer: tripmate
      audience: tripmate-api
      ttl: 15m
      # Tolerance for clocks of several app instances disagreeing slightly.
      clock-skew: 30s
      # Base64, at least 32 random bytes. No default: a missing key stops
      # startup instead of signing tokens with something guessable.
      signing-key: ${JWT_SIGNING_KEY}
      # The key being rotated out, still accepted for verification for one
      # token lifetime after a rotation. Empty the rest of the time.
      previous-signing-key: ${JWT_PREVIOUS_SIGNING_KEY:}
    session:
      # Fixed from sign-in; refreshing never extends it.
      lifetime: 30d
      # A token replaced less than this long ago still buys an access token
      # (no new refresh token), so two tabs refreshing together do not end
      # the session. Any later use of it is treated as theft.
      reuse-grace: 10s
    captcha:
      # "none" accepts every request. A real provider registers its own
      # CaptchaVerifier under another value; an unknown value stops startup.
      provider: none
    encryption:
      # Base64 of exactly 32 random bytes: the Key Encryption Key that wraps
      # every user's data key. No default: without it the app refuses to
      # start rather than encrypt under something guessable.
      kek: ${DATA_ENCRYPTION_KEK}
    phone:
      # Base64, at least 32 random bytes: keys the phone number blind index.
      # No default. Changing it orphans every stored index.
      blind-index-key: ${PHONE_BLIND_INDEX_KEY}
      # "mailbox" delivers codes to the account's email inbox instead of by
      # SMS, so the demo needs no SMS account. A real gateway registers its
      # own PhoneCodeSender under another value; an unknown value stops startup.
      sms-provider: ${SMS_PROVIDER:mailbox}
    selfie:
      # A selfie image is deleted this long after it is submitted, whatever
      # was decided. A selfie still waiting for review then is rejected.
      retention: 7d
      # Frames must arrive this soon after the check starts.
      challenge-ttl: 2m
      # Similarity at or above approve-at is approved, below reject-below is
      # rejected, and anything between goes to a reviewer.
      approve-at: 0.85
      reject-below: 0.60
      purge-batch-size: 100
      purge-interval: 1h
      purge-initial-delay: 5m
      # "mock" compares images, not faces; a real provider registers its own
      # LivenessVerifier under another value.
      liveness-provider: ${LIVENESS_PROVIDER:mock}
    verification-limits:
      phone-code:
        capacity: 5
        period: 1h
      phone-confirm:
        capacity: 20
        period: 10m
      selfie-challenge:
        capacity: 10
        period: 1h
      selfie-submission:
        capacity: 5
        period: 24h
      profile-photo:
        capacity: 10
        period: 1h
      vouch:
        capacity: 10
        period: 24h
      emergency-contact:
        capacity: 20
        period: 1h
      upi-id:
        capacity: 20
        period: 1h
      max-active-vouches: 5
    two-factor:
      # Shown by authenticator apps next to the code; must not contain ':'.
      issuer: TripMates
      # How long a login that passed the password waits for its second factor.
      challenge-ttl: 5m
      # Codes one such login accepts before the password is needed again.
      challenge-max-attempts: 5
    rate-limit:
      # Token buckets, refilled continuously: capacity requests per period.
      login-per-ip:
        capacity: 20
        period: 10m
      login-per-account:
        capacity: 10
        period: 10m
      register-per-ip:
        capacity: 10
        period: 1h
      verify-email-per-ip:
        capacity: 20
        period: 10m
      resend-per-ip:
        capacity: 10
        period: 1h
      refresh-per-ip:
        # Each signed-in browser refreshes about once per 15 minutes; this
        # leaves room for many users behind one NAT address.
        capacity: 60
        period: 10m
      second-factor-per-ip:
        capacity: 20
        period: 10m
      two-factor-per-account:
        # Setup, confirm, disable and backup-code changes together, per
        # signed-in account: each checks a password or a code.
        capacity: 10
        period: 15m

management:
  endpoints:
    # Deny-by-default for actuator too: every endpoint is switched off, not
    # just hidden from HTTP, and health is switched back on read-only. A new
    # endpoint (env, heapdump, loggers) can never appear by accident when a
    # dependency or Boot upgrade adds one.
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      # show-details: always is only safe because this is a local dev box
      # nobody but the developer can reach. A DOWN health check with full
      # details tells an attacker exactly which backing service to go after
      # (db vs redis) - this must drop to "when-authorized" (admin-only) or
      # "never" before this app is reachable from anywhere but localhost.
      show-details: always
      probes:
        enabled: true
  health:
    # Mail is sent in the background and a failed send is retried by the
    # user via "resend code". An SMTP outage must not mark the whole app
    # DOWN and get it restarted by the platform's health checks.
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema). MDC entries become
      # top-level fields, which is how correlationId lands on every line
      # written while a request is being handled.
      console: ecs

springdoc:
  # Pinned explicitly - SecurityConfig permits exactly these paths, so they
  # must not move if a springdoc upgrade changes its defaults.
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Swagger UI otherwise sends the spec URL to validator.swagger.io for a
    # badge image - a third-party call the Swagger UI CSP blocks anyway.
    validator-url: none
  # Only application endpoints are documented; actuator and /error are not.
  paths-to-match: /api/v1/**
